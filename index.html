
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>양손 초스피드 입력기-우째 이런 일이</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 18px 10px;
  background: #f2f3f5;
  font-family: Arial, "Malgun Gothic", sans-serif;
  color: #222;
}

.app {
  width: 100%;
  max-width: 650px;
  margin: 0 auto;
  background: #fff;
  border-radius: 18px;
  padding: 15px;
  box-shadow: 0 3px 16px rgba(0,0,0,.08);
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 12px;
}

.header h2 {
  font-size: 19px;
  margin: 0;
}

.header-buttons {
  display: flex;
  gap: 5px;
}

.small-btn {
  border: 0;
  border-radius: 7px;
  padding: 8px 10px;
  background: #e9edf2;
  font-size: 12px;
  cursor: pointer;
}

.output {
  width: 100%;
  min-height: 145px;
  padding: 13px;
  border: 1px solid #d8dce2;
  border-radius: 10px;
  background: #fff;
  font-size: 23px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin-bottom: 15px;
}

.keyboard {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.key-row {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 6px;
}

.key {
  min-width: 0;
  height: 57px;
  border: 1px solid #d9dde3;
  border-radius: 9px;
  background: #f8f9fb;
  color: #222;
  font-size: 23px;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
  touch-action: manipulation;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.key:active {
  background: #dce7f6;
  transform: scale(.97);
}

.key .sub {
  position: absolute;
  right: 5px;
  bottom: 4px;
  font-size: 10px;
  color: #777;
  font-weight: 400;
}

.key.special {
  background: #eaf0f7;
}

.key.back {
  background: #f5e9e9;
}

.key.mode {
  background: #e7eee8;
  font-size: 13px;
}

/* 맨 아래 행 정렬
   ? 오른쪽 끝 = ㅈ 오른쪽 끝
   스페이스바 왼쪽 = ㅊ 왼쪽
   스페이스바 오른쪽 = ㅁ 오른쪽 */
.bottom-row {
  display: grid;
  grid-template-columns:
    repeat(5, calc((100% - 84px) / 15))
    calc((100% - 12px) / 3)
    calc((100% - 30px) / 6)
    calc((100% - 30px) / 6);
  column-gap: 6px;
  width: 100%;
}

.bottom-row .key {
  height: 51px;
  min-width: 0;
}

/* A1기와 문장부호 */
.bottom-row .mode {
  font-size: 9px;
  padding: 0;
}

.bottom-row .punct {
  font-size: 12px;
  font-weight: 500;
}

/* 스페이스바 */
.bottom-row .space-key {
  font-size: 0;
  background: #e8edf3;
  overflow: visible;
}

.bottom-row .space-key::before {
  content: "⌴";
  display: block;
  font-size: 39px;
  line-height: 1;
  font-weight: 900;
  transform: scaleX(2.1);
}

/* ㅡ는 위쪽 ㅣ와 같은 크기 */
.bottom-row .eu-key {
  height: 57px;
  font-size: 23px;
}

/* 오른쪽 점은 위쪽 :와 같은 크기 */
.bottom-row .right-dot {
  height: 57px;
  font-size: 23px;
}

.tabs {
  display: flex;
  gap: 7px;
  margin-top: 12px;
}

.tab {
  flex: 1;
  border: 0;
  border-radius: 8px;
  padding: 11px 4px;
  background: #e9edf2;
  font-size: 13px;
  cursor: pointer;
}

.tab.active {
  background: #344d3a;
  color: #fff;
}

@media(max-width:420px) {
  .app { padding: 10px; }

  .key-row {
    gap: 4px;
  }

  .key {
    height: 52px;
    font-size: 20px;
  }

  .bottom-row {
    column-gap: 4px;
    grid-template-columns:
      repeat(5, calc((100% - 56px) / 15))
      calc((100% - 8px) / 3)
      calc((100% - 20px) / 6)
      calc((100% - 20px) / 6);
  }

  .bottom-row .key {
    height: 47px;
  }

  .bottom-row .mode {
    font-size: 8px;
  }

  .bottom-row .punct {
    font-size: 11px;
  }

  .bottom-row .eu-key,
  .bottom-row .right-dot {
    height: 52px;
    font-size: 20px;
  }

  .bottom-row .space-key::before {
    font-size: 35px;
  }
}
</style>
</head>

<body>
<div class="app">

  <div class="header">
    <h2>양손 초스피드 입력기-우째 이런 일이</h2>
    <div class="header-buttons">
      <button class="small-btn" id="copyBtn">복사</button>
      <button class="small-btn" id="clearBtn">전체 지우기</button>
    </div>
  </div>

  <div class="output" id="output"></div>

  <div class="keyboard" id="keyboard"></div>
  <div class="tabs" id="tabs"></div>

</div>

<script>
/* ==========================================
   한글 조합 엔진
   조합 로직 변경 없음
========================================== */

class KoreanIME {
  constructor(onUpdate) {
    this.text = '';
    this.cho = '';
    this.jung = '';
    this.jong = '';
    this.ssang = false;
    this.onUpdate = onUpdate;

    this.CHO = [
      'ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ',
      'ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'
    ];

    this.JUNG = [
      'ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ',
      'ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ',
      'ㅡ','ㅢ','ㅣ'
    ];

    this.JONG = [
      '', 'ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ',
      'ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ',
      'ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'
    ];

    this.DOUBLE = {
      'ㄱ':'ㄲ',
      'ㄷ':'ㄸ',
      'ㅂ':'ㅃ',
      'ㅅ':'ㅆ',
      'ㅈ':'ㅉ'
    };

    this.COMPOUND = {
      'ㄱㅅ':'ㄳ',
      'ㄴㅈ':'ㄵ',
      'ㄴㅎ':'ㄶ',
      'ㄹㄱ':'ㄺ',
      'ㄹㅁ':'ㄻ',
      'ㄹㅂ':'ㄼ',
      'ㄹㅅ':'ㄽ',
      'ㄹㅌ':'ㄾ',
      'ㄹㅍ':'ㄿ',
      'ㄹㅎ':'ㅀ',
      'ㅂㅅ':'ㅄ'
    };

    this.SPLIT = {
      'ㄳ':['ㄱ','ㅅ'],
      'ㄵ':['ㄴ','ㅈ'],
      'ㄶ':['ㄴ','ㅎ'],
      'ㄺ':['ㄹ','ㄱ'],
      'ㄻ':['ㄹ','ㅁ'],
      'ㄼ':['ㄹ','ㅂ'],
      'ㄽ':['ㄹ','ㅅ'],
      'ㄾ':['ㄹ','ㅌ'],
      'ㄿ':['ㄹ','ㅍ'],
      'ㅀ':['ㄹ','ㅎ'],
      'ㅄ':['ㅂ','ㅅ']
    };

    this.VOWEL_COMBINE = {
      'ㅏㅣ':'ㅐ',
      'ㅑㅣ':'ㅒ',
      'ㅓㅣ':'ㅔ',
      'ㅕㅣ':'ㅖ',
      'ㅗㅏ':'ㅘ',
      'ㅗㅐ':'ㅙ',
      'ㅗㅣ':'ㅚ',
      'ㅜㅓ':'ㅝ',
      'ㅜㅔ':'ㅞ',
      'ㅜㅣ':'ㅟ',
      'ㅡㅣ':'ㅢ'
    };

    this.STROKE = {
      'ㅣ_·':'ㅏ',
      'ㅣ_··':'ㅑ',
      '·_ㅣ':'ㅓ',
      '··_ㅣ':'ㅕ',
      '·_ㅡ':'ㅗ',
      '··_ㅡ':'ㅛ',
      'ㅡ_·':'ㅜ',
      'ㅡ_··':'ㅠ'
    };
  }

  composing() {
    if (!this.cho) return this.jung || '';

    const ci = this.CHO.indexOf(this.cho);
    if (ci < 0) return this.cho;

    if (!this.jung) return this.cho;

    const vi = this.JUNG.indexOf(this.jung);
    if (vi < 0) return this.cho + this.jung;

    const ti = this.JONG.indexOf(this.jong);
    return String.fromCharCode(
      0xAC00 + (ci * 21 + vi) * 28 + Math.max(0, ti)
    );
  }

  display() {
    return this.text + this.composing();
  }

  update() {
    if (this.onUpdate) this.onUpdate(this.display());
  }

  commit() {
    if (this.cho || this.jung) {
      this.text += this.composing();
    }
    this.cho = '';
    this.jung = '';
    this.jong = '';
    this.ssang = false;
    this.update();
  }

  consonant(c) {
    if (this.ssang && this.DOUBLE[c]) {
      c = this.DOUBLE[c];
      this.ssang = false;
    }

    if (!this.cho && !this.jung) {
      this.cho = c;
      this.update();
      return;
    }

    if (this.cho && !this.jung) {
      this.commit();
      this.cho = c;
      this.update();
      return;
    }

    if (this.cho && this.jung && !this.jong) {
      this.jong = c;
      this.update();
      return;
    }

    if (this.jong) {
      const combined = this.COMPOUND[this.jong + c];

      if (combined) {
        this.jong = combined;
        this.update();
        return;
      }

      this.commit();
      this.cho = c;
      this.update();
      return;
    }
  }

  vowel(v) {
    this.ssang = false;

    if (!this.cho && !this.jung) {
      this.jung = v;
      this.update();
      return;
    }

    if (this.cho && !this.jung) {
      this.jung = v;
      this.update();
      return;
    }

    if (this.cho && this.jung && this.jong) {
      const oldJong = this.jong;
      let previousJong = '';
      let nextCho = oldJong;

      if (this.SPLIT[oldJong]) {
        previousJong = this.SPLIT[oldJong][0];
        nextCho = this.SPLIT[oldJong][1];
      }

      this.jong = previousJong;
      this.commit();
      this.cho = nextCho;
      this.jung = v;
      this.update();
      return;
    }

    const combined = this.VOWEL_COMBINE[this.jung + v];

    if (combined) {
      this.jung = combined;
      this.update();
      return;
    }

    const strokeCombined = this.STROKE[this.jung + '_' + v];

    if (strokeCombined) {
      this.jung = strokeCombined;
      this.update();
      return;
    }

    this.commit();
    this.jung = v;
    this.update();
  }

  ssangKey() {
    if (this.jong && this.DOUBLE[this.jong]) {
      const doubled = this.DOUBLE[this.jong];
      this.jong = '';
      this.commit();
      this.cho = doubled;
      this.ssang = false;
      this.update();
      return;
    }

    if (this.cho && !this.jung && this.DOUBLE[this.cho]) {
      this.cho = this.DOUBLE[this.cho];
      this.ssang = false;
      this.update();
      return;
    }

    this.ssang = !this.ssang;
    this.update();
  }

  backspace() {
    if (this.jong) {
      if (this.SPLIT[this.jong]) {
        this.jong = this.SPLIT[this.jong][0];
      } else {
        this.jong = '';
      }
    } else if (this.jung) {
      this.jung = '';
    } else if (this.cho) {
      this.cho = '';
    } else if (this.text.length) {
      this.text = this.text.slice(0, -1);
    }

    this.update();
  }

  direct(value) {
    this.commit();
    this.text += value;
    this.update();
  }

  space() {
    this.commit();
    this.text += ' ';
    this.update();
  }

  clear() {
    this.text = '';
    this.cho = '';
    this.jung = '';
    this.jong = '';
    this.ssang = false;
    this.update();
  }
}

/* ==========================================
   입력기 화면
========================================== */

const output = document.getElementById('output');
const keyboard = document.getElementById('keyboard');
const tabs = document.getElementById('tabs');

const ime = new KoreanIME(value => {
  output.textContent = value;
});

let mode = 'KR';

const koreanRows = [
  [
    {label:'ㅇ', type:'consonant', value:'ㅇ', sub:'1'},
    {label:'ㄱ', type:'consonant', value:'ㄱ', sub:'2'},
    {label:'ㄴ', type:'consonant', value:'ㄴ', sub:'3'},
    {label:'ㄷ', type:'consonant', value:'ㄷ', sub:'#·'},
    {label:'ㅂ', type:'consonant', value:'ㅂ', sub:'!'},
    {label:'쌍', type:'ssang'}
  ],
  [
    {label:'ㅎ', type:'consonant', value:'ㅎ', sub:'4'},
    {label:'ㅋ', type:'consonant', value:'ㅋ', sub:'5'},
    {label:'ㄹ', type:'consonant', value:'ㄹ', sub:'6'},
    {label:'ㅌ', type:'consonant', value:'ㅌ', sub:'@'},
    {label:'ㅍ', type:'consonant', value:'ㅍ', sub:'~'},
    {label:'←', type:'back', className:'back'}
  ],
  [
    {label:'ㅅ', type:'consonant', value:'ㅅ', sub:'7'},
    {label:'ㅈ', type:'consonant', value:'ㅈ', sub:'8'},
    {label:'ㅊ', type:'consonant', value:'ㅊ', sub:'9'},
    {label:'ㅁ', type:'consonant', value:'ㅁ', sub:'0'},
    {label:'ㅣ', type:'vowel', value:'ㅣ'},
    {label:':', type:'vowel-double'}
  ]
];

const bottomKeys = [
  {label:'A1기', type:'mode', className:'mode'},
  {label:'.', type:'direct', value:'.', className:'punct'},
  {label:',', type:'direct', value:',', className:'punct'},
  {label:'!', type:'direct', value:'!', className:'punct'},
  {label:'?', type:'direct', value:'?', className:'punct'},
  {label:'⌴', type:'space', className:'space-key'},
  {label:'ㅡ', type:'vowel', value:'ㅡ', className:'eu-key'},
  {label:'.', type:'vowel-dot', className:'right-dot'}
];

const englishRows = [
  ['a','b','c','d','e','f'],
  ['g','h','i','j','k','l'],
  ['m','n','o','p','q','r'],
  ['s','t','u','v','w','x'],
  ['y','z']
];

const numberRows = [
  ['1','2','3'],
  ['4','5','6'],
  ['7','8','9'],
  ['0']
];

const symbolRows = [
  ['+','−','×','÷','=','/'],
  ['_','<','>','[',']','\\'],
  ['@','#','$','%','^','&'],
  ['(',')','{','}','~','`'],
  ['!','?','.',',',':',';'],
  ["'",'"','|','₩','…','·']
];

function createKey(item) {
  const button = document.createElement('button');
  button.className = 'key ' + (item.className || '');

  button.textContent = item.label;

  if (item.sub) {
    const sub = document.createElement('span');
    sub.className = 'sub';
    sub.textContent = item.sub;
    button.appendChild(sub);
  }

  button.addEventListener('pointerdown', e => {
    e.preventDefault();
  });

  button.addEventListener('click', () => {
    handleKey(item);
  });

  return button;
}

function handleKey(item) {
  switch (item.type) {
    case 'consonant':
      ime.consonant(item.value);
      break;

    case 'vowel':
      ime.vowel(item.value);
      break;

    case 'vowel-dot':
      ime.vowel('·');
      break;

    case 'vowel-double':
      ime.vowel('··');
      break;

    case 'ssang':
      ime.ssangKey();
      break;

    case 'back':
      ime.backspace();
      break;

    case 'space':
      ime.space();
      break;

    case 'direct':
      ime.direct(item.value);
      break;

    case 'mode':
      changeMode('EN');
      break;

    case 'text':
      ime.direct(item.value);
      break;
  }
}

function renderKorean() {
  keyboard.innerHTML = '';

  koreanRows.forEach(row => {
    const rowElement = document.createElement('div');
    rowElement.className = 'key-row';

    row.forEach(item => {
      rowElement.appendChild(createKey(item));
    });

    keyboard.appendChild(rowElement);
  });

  const bottom = document.createElement('div');
  bottom.className = 'bottom-row';

  bottomKeys.forEach(item => {
    bottom.appendChild(createKey(item));
  });

  keyboard.appendChild(bottom);
}

function renderEnglish() {
  keyboard.innerHTML = '';

  englishRows.slice(0, 4).forEach(row => {
    const rowElement = document.createElement('div');
    rowElement.className = 'key-row';

    row.forEach(letter => {
      rowElement.appendChild(createKey({
        label: letter,
        type: 'text',
        value: letter
      }));
    });

    keyboard.appendChild(rowElement);
  });

  const bottomRow = document.createElement('div');
  bottomRow.className = 'nav-row';

  ['y', 'z'].forEach(letter => {
    bottomRow.appendChild(createKey({
      label: letter,
      type: 'text',
      value: letter
    }));
  });

  bottomRow.appendChild(makeTab('숫자', 'NUM'));
  bottomRow.appendChild(makeTab('기호', 'SYM'));
  bottomRow.appendChild(makeTab('한글', 'KR'));

  keyboard.appendChild(bottomRow);
}

function renderNumbers() {
  keyboard.innerHTML = '';

  numberRows.forEach(row => {
    const rowElement = document.createElement('div');
    rowElement.className = 'key-row';

    row.forEach(number => {
      rowElement.appendChild(createKey({
        label: number,
        type: 'text',
        value: number
      }));
    });

    keyboard.appendChild(rowElement);
  });

  renderBottomTabs();
}

function renderSymbols() {
  keyboard.innerHTML = '';

  symbolRows.forEach(row => {
    const rowElement = document.createElement('div');
    rowElement.className = 'key-row';

    row.forEach(symbol => {
      rowElement.appendChild(createKey({
        label: symbol,
        type: 'text',
        value: symbol
      }));
    });

    keyboard.appendChild(rowElement);
  });

  renderBottomTabs();
}

function makeTab(label, target) {
  const button = document.createElement('button');
  button.className = 'tab';
  button.textContent = label;
  button.addEventListener('click', () => changeMode(target));
  return button;
}

function renderBottomTabs() {
  tabs.innerHTML = '';
  tabs.classList.add('show');
  tabs.appendChild(makeTab('숫자', 'NUM'));
  tabs.appendChild(makeTab('기호', 'SYM'));
  tabs.appendChild(makeTab('한글', 'KR'));
}

function changeMode(newMode) {
  mode = newMode;

  if (mode === 'KR') {
    tabs.innerHTML = '';
    tabs.classList.remove('show');
    renderKorean();
  }

  if (mode === 'EN') {
    tabs.innerHTML = '';
    tabs.classList.remove('show');
    renderEnglish();
  }

  if (mode === 'NUM') renderNumbers();
  if (mode === 'SYM') renderSymbols();
}

/* ==========================================
   상단 버튼
========================================== */

document.getElementById('copyBtn').addEventListener('click', async () => {
  ime.commit();

  try {
    await navigator.clipboard.writeText(ime.text);
    alert('복사했습니다.');
  } catch (e) {
    const temp = document.createElement('textarea');
    temp.value = ime.text;
    document.body.appendChild(temp);
    temp.select();
    document.execCommand('copy');
    temp.remove();
    alert('복사했습니다.');
  }
});

document.getElementById('clearBtn').addEventListener('click', () => {
  ime.clear();
});

renderKorean();
tabs.innerHTML = '';
tabs.classList.remove('show');
</script>
</body>
</html>
